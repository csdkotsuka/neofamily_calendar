<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会長トークショー カレンダー | NEO FAMILY</title>
  <meta name="description" content="ぶった斬り会長トークショー・マルシェ公式スケジュール。Googleカレンダー追加、スマホカレンダー登録対応。">
  <meta property="og:title" content="会長トークショー カレンダー | NEO FAMILY">
  <meta property="og:description" content="ぶった斬り会長トークショー公式日程カレンダー">
  <meta property="og:image" content="images/kusanagi_face.jpg">
  <meta property="og:type" content="website">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f43f5e">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="text-slate-800 antialiased bg-slate-50/50">

  <!-- Top Navigation -->
  <header class="glass-header border-b border-slate-200/80 bg-white/90">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 md:h-18">
        
        <!-- ブランドロゴ & タイトル -->
        <a href="./" class="flex items-center gap-3 cursor-pointer group">
          <img src="images/logo.png" alt="NEO FAMILY Logo" class="w-10 h-10 md:w-11 md:h-11 rounded-full object-contain shadow-xs border border-amber-200/60 bg-white group-hover:scale-105 transition-transform">
          <div>
            <div class="flex items-center gap-2">
              <span class="font-display font-black text-base md:text-lg tracking-tight text-slate-900">NEO FAMILY</span>
              <span class="text-slate-300">×</span>
              <span class="font-serif font-bold text-sm md:text-base text-slate-800 tracking-wider">RAYTUS</span>
              <span class="px-1.5 py-0.5 text-[9px] font-black rounded-sm bg-amber-500/10 text-amber-700 border border-amber-300/40">PORTAL</span>
            </div>
            <p class="text-[11px] text-slate-500 font-medium hidden sm:block">総合ポータル & 参加ナビゲーション</p>
          </div>
        </a>

        <!-- ヘッダー右側アクション -->
        <div class="flex items-center gap-2 sm:gap-3">
          <a href="https://shopping.community-iyasakagu.jp/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-50 text-amber-800 border border-amber-300/60 hover:bg-amber-100 transition shadow-2xs">
            <i class="fa-solid fa-cart-shopping text-amber-600"></i>
            <span>Iyasaka宮</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-[9px] text-amber-500"></i>
          </a>
          <a href="flowchart" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-50 text-amber-800 border border-amber-300/60 hover:bg-amber-100 transition shadow-2xs">
            <i class="fa-solid fa-arrows-split-up-and-left text-amber-600"></i>
            <span>参加フロー</span>
          </a>
          <a href="admin.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-800 bg-slate-100 hover:bg-slate-200 border border-slate-300 shadow-2xs transition">
            <i class="fa-solid fa-lock text-slate-600 text-[11px]"></i>
            <span>管理</span>
          </a>
        </div>
      </div>

      <!-- 統一グローバルナビゲーション -->
      <nav class="flex items-center gap-1 overflow-x-auto no-scrollbar py-2 border-t border-slate-100 text-xs font-bold">
        <a href="./" id="nav-item-hub" class="nav-item whitespace-nowrap px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-compass"></i>
          <span>総合ポータル</span>
        </a>
        <a href="flowchart" id="nav-item-flowchart" class="nav-item whitespace-nowrap px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-arrows-split-up-and-left text-amber-500"></i>
          <span>参加フローチャート</span> 
        </a>
        <a href="raytus" id="nav-item-raytus" class="nav-item whitespace-nowrap px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-globe text-slate-400"></i>
          <span>RAYTUS 全事業</span>
        </a>
        <a href="calendar" id="nav-item-calendar" class="nav-item whitespace-nowrap px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 hover:bg-slate-100">
          <i class="fa-regular fa-calendar-days text-rose-500"></i>
          <span>イベントカレンダー</span>
        </a>
        <a href="caravan" id="nav-item-caravan" class="nav-item whitespace-nowrap px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 bg-slate-900 text-white shadow-xs">
          <i class="fa-solid fa-bullhorn text-rose-500"></i>
          <span>会長トークショー</span>
        </a>
        <a href="archive" id="nav-item-archive" class="nav-item whitespace-nowrap px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-graduation-cap text-indigo-500"></i>
          <span>勉強会アーカイブ</span>
        </a>
        <a href="sns" id="nav-item-sns" class="nav-item whitespace-nowrap px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-share-nodes text-pink-500"></i>
          <span>公式SNS</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Controls Bar: View Switcher & Search (テキスト最小限・絞り込みなし) -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-5 pb-2">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
      
      <!-- View Switcher & 会長アイコン -->
      <div class="flex items-center gap-3 overflow-x-auto no-scrollbar pb-1 md:pb-0 w-full md:w-auto">
        <!-- 会長顔写真バッジ（月間カレンダーボタンの左） -->
        <div class="flex items-center gap-2.5 shrink-0 bg-white px-3 py-1.5 rounded-2xl border border-rose-200/80 shadow-2xs">
          <img src="images/kaicho_face.jpg" alt="ぶった斬り会長" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full object-cover border-2 border-rose-500 shadow-xs">
          <div class="leading-tight">
            <div class="text-[10px] font-black tracking-wider text-rose-600 uppercase">TALK SHOW</div>
            <div class="text-xs sm:text-sm font-black text-slate-900">ぶった斬り会長</div>
          </div>
        </div>

        <!-- View Switcher Tabs (3 modes: Month Calendar, Week, and Cards) -->
        <div class="flex items-center p-1 bg-slate-200/80 rounded-2xl flex-1 md:flex-initial shadow-inner">
          <button id="btn-view-calendar" onclick="switchViewMode('calendar')" class="flex-1 md:flex-initial px-4 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-rose-600 text-white shadow-md">
            <i class="fa-regular fa-calendar-days"></i>
            <span>月間カレンダー</span>
          </button>
          <button id="btn-view-week" onclick="switchViewMode('week')" class="flex-1 md:flex-initial px-4 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-white text-slate-700 hover:bg-slate-100">
            <i class="fa-solid fa-calendar-week"></i>
            <span>週間カレンダー</span>
          </button>
          <button id="btn-view-cards" onclick="switchViewMode('cards')" class="flex-1 md:flex-initial px-4 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-white text-slate-700 hover:bg-slate-100">
            <i class="fa-solid fa-grip"></i>
            <span>カード一覧</span>
          </button>
        </div>
      </div>

      <!-- Search Box -->
      <div class="flex items-center gap-2 w-full md:w-auto">
        <div class="relative flex-1 md:w-80">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="search-input" placeholder="イベント名、会場、地域を検索..." class="w-full pl-9 pr-4 py-2 bg-white rounded-xl text-xs font-medium border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 shadow-sm">
        </div>
      </div>
    </div>

    <!-- Filter Pills (絞り込みボタン) -->
    <div class="flex items-center gap-2 overflow-x-auto py-2.5 mt-2 no-scrollbar">
      <button id="btn-past-caravan-filter" onclick="togglePastEvents()" class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition border border-slate-200 bg-white text-slate-700 hover:bg-slate-100 shadow-2xs flex items-center gap-1.5 shrink-0">
        <i class="fa-solid fa-clock-rotate-left text-slate-500"></i>
        <span id="past-caravan-filter-text">過去のイベントを表示</span>
        <span id="past-caravan-count-badge" class="px-1.5 py-0.2 rounded-full text-[10px] bg-slate-100 text-slate-600 font-bold"></span>
      </button>
    </div>
  </section>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-3 pb-16">

    <!-- View Mode 1: Cards View -->
    <section id="cards-view-section" class="hidden">
      <!-- Selected date indicator if active -->
      <div id="selected-date-indicator" class="hidden"></div>

      <!-- Event Cards Grid -->
      <div id="events-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered dynamically via caravan-app.js -->
      </div>
    </section>

    <!-- View Mode 2: Week Timetable View -->
    <section id="week-view-section" class="hidden">
      <div class="glass-card rounded-3xl p-4 sm:p-6 md:p-8 border border-slate-200 mb-8 bg-white shadow-xs">
        <!-- Week Header -->
        <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
          <div class="flex items-center gap-3">
            <h2 id="week-range-title" class="text-xl md:text-2xl font-black text-slate-900 tracking-tight">
              2026年 11月8日(日) 〜 11月14日(土)
            </h2>
            <button onclick="goToTodayWeek()" class="text-xs font-bold px-2.5 py-1 bg-rose-50 text-rose-700 border border-rose-200 rounded-lg hover:bg-rose-100 transition shadow-2xs flex items-center gap-1">
              <i class="fa-regular fa-calendar-check text-[11px]"></i>
              <span>今日へ移動</span>
            </button>
          </div>
          <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl">
            <button onclick="changeWeek(-1)" title="前の週" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-600 hover:bg-white hover:shadow-sm transition">
              <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <button onclick="changeWeek(1)" title="次の週" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-600 hover:bg-white hover:shadow-sm transition">
              <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
          </div>
        </div>

        <p class="text-xs text-slate-500 mb-4 flex items-center gap-1">
          <i class="fa-regular fa-clock text-rose-500"></i>
          時間帯ごとのスケジュールを確認できます。イベントをクリックすると詳細が開きます。
        </p>

        <!-- Week Timetable Grid -->
        <div id="week-timetable-container" class="overflow-x-auto rounded-2xl border border-slate-200/90 bg-white shadow-xs">
          <!-- Rendered dynamically via caravan-app.js -->
        </div>
      </div>
    </section>

    <!-- View Mode 3: Native Month Calendar View (Default) -->
    <section id="calendar-view-section">
      <div class="glass-card rounded-3xl p-4 sm:p-6 md:p-8 border border-slate-200 mb-8 bg-white shadow-xs">
        <!-- Calendar Header -->
        <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
          <div class="flex items-center gap-3">
            <h2 id="calendar-month-title" class="text-xl md:text-2xl font-black text-slate-900 tracking-tight">
              2026年 11月
            </h2>
            <button onclick="goToToday()" class="text-xs font-bold px-2.5 py-1 bg-rose-50 text-rose-700 border border-rose-200 rounded-lg hover:bg-rose-100 transition shadow-2xs flex items-center gap-1">
              <i class="fa-regular fa-calendar-check text-[11px]"></i>
              <span>今日へ移動</span>
            </button>
          </div>
          <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl">
            <button onclick="changeMonth(-1)" title="前の月" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-600 hover:bg-white hover:shadow-sm transition">
              <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <button onclick="changeMonth(1)" title="次の月" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-600 hover:bg-white hover:shadow-sm transition">
              <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
          </div>
        </div>

        <!-- Day Names Header -->
        <div class="grid grid-cols-7 text-center text-xs font-bold py-2 border-b border-slate-200 mb-2">
          <div class="text-rose-600 font-extrabold">日</div>
          <div class="text-slate-600">月</div>
          <div class="text-slate-600">火</div>
          <div class="text-slate-600">水</div>
          <div class="text-slate-600">木</div>
          <div class="text-slate-600">金</div>
          <div class="text-blue-600 font-extrabold">土</div>
        </div>

        <!-- Month Grid -->
        <div id="calendar-days-grid" class="calendar-grid">
          <!-- Rendered dynamically via caravan-app.js -->
        </div>
      </div>
    </section>

  </main>

  <!-- Event Detail Modal (ESCキーまたは外側クリックで閉じる) -->
  <div id="event-modal" onclick="if(event.target === this) closeEventModal()" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm cursor-pointer overflow-y-auto">
    <div class="relative w-full max-w-2xl bg-white rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-200 my-8 cursor-default" onclick="event.stopPropagation()">
      <button onclick="closeEventModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition z-10" title="閉じる (ESC)">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
      <div id="event-modal-body">
        <!-- Rendered dynamically via caravan-app.js -->
      </div>
    </div>
  </div>

  <!-- Application Scripts -->
  <script src="js/caravan-events-data.js?v=20261025_3"></script>
  <script src="js/caravan-app.js?v=20261025_3"></script>
</body>
</html>
